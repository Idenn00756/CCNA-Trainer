<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Тренажёр CCNA 200-301: карточки с интервальным повторением, мини-лекции, подсети, команды IOS и кейсы по курсу Jeremy's IT Lab.">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCNA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>Тренажёр CCNA 200-301</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png" type="image/png">
</head>
<body><style>
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#E8ECEA; --surface-3:#DFE4E2;
  --line:#D2D9D6; --line-2:#BFC8C5;
  --ink:#15201D; --ink-2:#44524E; --muted:#6E7B77;
  --accent:#A85F08; --accent-2:#8C4E06; --accent-soft:#F7E9D4; --on-accent:#FFFFFF;
  --ok:#15774B; --ok-bg:#E2F2E9; --ok-line:#A9D6BF;
  --bad:#AC2A20; --bad-bg:#FAE7E4; --bad-line:#E8B4AE;
  --wo:#C2620F; --wg:#3C7A4E; --wb:#2A5FB0; --wn:#8A6236;
  --shadow:0 1px 2px rgba(21,32,29,.06), 0 8px 24px -12px rgba(21,32,29,.18);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --disp:"Unbounded", "Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#171E1C; --surface-2:#1E2725; --surface-3:#25302D;
    --line:#2C3937; --line-2:#3B4A47;
    --ink:#E9EEEC; --ink-2:#B0BDB9; --muted:#82918C;
    --accent:#E8A33C; --accent-2:#F2B85C; --accent-soft:#32281A; --on-accent:#12100B;
    --ok:#4ABF8A; --ok-bg:#122A21; --ok-line:#23543F;
    --bad:#F0776C; --bad-bg:#2B1614; --bad-line:#5C2A24;
    --wo:#E89A4A; --wg:#63B47D; --wb:#7BA3EA; --wn:#C09462;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1C; --surface-2:#1E2725; --surface-3:#25302D;
  --line:#2C3937; --line-2:#3B4A47;
  --ink:#E9EEEC; --ink-2:#B0BDB9; --muted:#82918C;
  --accent:#E8A33C; --accent-2:#F2B85C; --accent-soft:#32281A; --on-accent:#12100B;
  --ok:#4ABF8A; --ok-bg:#122A21; --ok-line:#23543F;
  --bad:#F0776C; --bad-bg:#2B1614; --bad-line:#5C2A24;
  --wo:#E89A4A; --wg:#63B47D; --wb:#7BA3EA; --wn:#C09462;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3{margin:0; text-wrap:balance}
a{color:var(--accent)}
input{font:inherit; color:inherit}
.hide{display:none !important}

.wire{width:4px; height:14px; border-radius:2px; background:var(--w); flex:none}
.wire.st{background:repeating-linear-gradient(180deg, var(--w) 0 3px, var(--surface) 3px 5px)}

/* ── рейка ──────────────────────────────────────────── */
.rail{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.rail-in{max-width:880px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px}
.brand b{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:-.01em}
.brand .ver{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.06em; padding:1px 6px; border:1px solid var(--accent); border-radius:4px; line-height:1.5}
.gauges{display:flex; gap:15px; align-items:center; margin-left:auto}
.g{display:flex; flex-direction:column; gap:1px; min-width:52px}
.g .gl{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.g .gv{font-family:var(--mono); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.g.due .gv{color:var(--accent)}
.railbar{flex:1 1 100%; height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.railbar i{display:block; height:100%; background:var(--ok); transition:width .35s ease}

/* ── сегментированные переключатели ─────────────────── */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--surface); flex:none}
.seg button{border:0; background:transparent; padding:5px 11px; font-size:12.5px; color:var(--muted); font-family:var(--mono); letter-spacing:.01em; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); font-weight:600}
.seg.modes button{padding:6px 13px; font-family:var(--body); font-size:13px}
.seg.modes button[aria-pressed="true"]{color:var(--accent)}

main{max-width:880px; margin:0 auto; padding:18px 20px 80px; display:flex; flex-direction:column; gap:18px}
.toolbar{display:flex; flex-direction:column; gap:10px}
.filters{display:flex; flex-wrap:wrap; gap:7px; align-items:center}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 8px; font-size:12.5px; font-weight:500; color:var(--ink-2); transition:border-color .15s, color .15s, background .15s, opacity .15s}
.chip:hover{border-color:var(--line-2); color:var(--ink)}
.chip .days{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.chip .cnt{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--surface-2); border-color:var(--line-2); color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.4}
.chip[aria-pressed="false"] .wire{background:var(--muted)}
.toolrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tlabel{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.mini{background:none; border:0; padding:5px 8px; font-size:12.5px; color:var(--muted); border-radius:6px}
.mini:hover{color:var(--ink); background:var(--surface-2)}

/* ── карточка ───────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.chead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 20px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.dtag{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink-2)}
.day{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.03em}
.pos{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.badge{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:1px 6px; line-height:1.6}
.badge.q{color:var(--muted); border-color:var(--line-2)}
.qbody{padding:22px 20px 20px; display:flex; flex-direction:column; gap:15px}
.q{font-size:18px; font-weight:500; line-height:1.45; max-width:62ch}
.cli{font-family:var(--mono); font-size:13px; line-height:1.65; background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:12px 14px; margin:0; overflow-x:auto; white-space:pre; color:var(--ink-2)}

/* ── схема ──────────────────────────────────────────── */
.figwrap{overflow-x:auto; padding:4px 0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px}
.fig{display:block; height:auto; margin:0 auto; max-width:100%}
.fig .dv{fill:var(--surface); stroke:var(--ink-2); stroke-width:1.6; stroke-linejoin:round}
.fig .dl{stroke:var(--ink-2); stroke-width:1.4; fill:none; stroke-linecap:round}
.fig .ed{stroke:var(--line-2); stroke-width:2}
.fig .ed.hl{stroke:var(--accent); stroke-width:2.6}
.fig .ed.dash{stroke-dasharray:5 4}
.fig .dn{fill:var(--ink); font-family:var(--body); font-size:12px; font-weight:600; text-anchor:middle}
.fig .ds{fill:var(--muted); font-family:var(--mono); font-size:10px; text-anchor:middle}
.fig .el{fill:var(--ink-2); font-family:var(--mono); font-size:10px; text-anchor:middle}
.fig .el.acc{fill:var(--accent)}
.fig text{paint-order:stroke; stroke:var(--surface-2); stroke-width:4px; stroke-linejoin:round}

/* ── варианты ───────────────────────────────────────── */
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:11px 14px; font-size:15px; line-height:1.45; transition:border-color .15s, background .15s, opacity .2s}
.opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .key{font-family:var(--mono); font-size:11.5px; font-weight:600; width:20px; height:20px; flex:none; margin-top:1px; display:grid; place-items:center; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted)}
.opt .otext{flex:1; min-width:0; overflow-wrap:anywhere}
.opt .mark{font-family:var(--mono); font-size:13px; font-weight:600; flex:none; margin-top:1px}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .key{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.opt.ok{border-color:var(--ok-line); background:var(--ok-bg)}
.opt.ok .key{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.ok .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad-line); background:var(--bad-bg)}
.opt.bad .key{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.5}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ── разбор ─────────────────────────────────────────── */
.res{border-top:1px solid var(--line); padding:18px 20px 20px; display:flex; flex-direction:column; gap:12px}
.res.ok{background:var(--ok-bg); border-top-color:var(--ok-line)}
.res.bad{background:var(--bad-bg); border-top-color:var(--bad-line)}
.verdict{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:-.01em; display:flex; align-items:center; gap:9px}
.res.ok .verdict{color:var(--ok)} .res.bad .verdict{color:var(--bad)}
.verdict .vi{width:19px; height:19px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--surface); flex:none}
.res.ok .vi{background:var(--ok)} .res.bad .vi{background:var(--bad)}
.why{margin:0; font-size:15px; line-height:1.6; color:var(--ink); max-width:64ch}
.why b{font-weight:600}
.en{font-family:var(--mono); font-size:.85em; color:var(--muted)}
.yours{font-size:14px; line-height:1.55; color:var(--ink-2); max-width:64ch; border-left:2px solid var(--bad); padding-left:11px}
.yours .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--bad); display:block; margin-bottom:2px}
details.others{font-size:14px}
details.others summary{font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; padding:3px 0}
details.others summary::-webkit-details-marker{display:none}
details.others summary::before{content:"+"; font-weight:600}
details.others[open] summary::before{content:"–"}
details.others summary:hover{color:var(--ink-2)}
details.others ul{margin:8px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
details.others li{display:flex; gap:9px; color:var(--ink-2); line-height:1.5; max-width:64ch}
details.others li .k{font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--muted); flex:none; padding-top:2px}
code{font-family:var(--mono); font-size:.88em; background:var(--surface-3); padding:1px 5px; border-radius:4px}
.res code{background:color-mix(in srgb, var(--ink) 9%, transparent)}

/* ── оценка интервального повторения ────────────────── */
.rate{display:flex; flex-direction:column; gap:7px}
.rate .rl{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.rbtns{display:flex; gap:8px; flex-wrap:wrap}
.rb{display:flex; flex-direction:column; align-items:flex-start; gap:1px; border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:7px 15px; transition:border-color .15s, background .15s}
.rb b{font-size:13.5px; font-weight:600}
.rb span{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.rb:hover{border-color:var(--accent); background:var(--accent-soft)}
.rb.again{border-color:var(--bad-line)} .rb.again b{color:var(--bad)}
.rb.easy b{color:var(--ok)}

/* ── управление ─────────────────────────────────────── */
.controls{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{background:var(--surface); border:1px solid var(--line-2); border-radius:7px; padding:9px 16px; font-size:14px; font-weight:500; transition:border-color .15s, background .15s, color .15s}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2); color:var(--on-accent)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:9px 10px}
.btn.ghost:hover{color:var(--ink); background:var(--surface-2)}
.spacer{margin-left:auto}
.foot{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; font-family:var(--mono); font-size:11px; color:var(--muted)}
.keys{display:flex; gap:14px; flex-wrap:wrap}
.keys kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--ink-2); background:var(--surface)}

/* ── итоги / пустые состояния ───────────────────────── */
.sum{padding:26px 20px 22px; display:flex; flex-direction:column; gap:20px}
.sum h2{font-family:var(--disp); font-weight:600; font-size:19px; letter-spacing:-.015em}
.score{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.score .big{font-family:var(--mono); font-size:44px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.score .sub{font-size:13.5px; color:var(--muted); font-family:var(--body)}
.dstats{display:flex; flex-direction:column; gap:12px}
.drow{display:grid; grid-template-columns:1fr auto; gap:5px 12px; align-items:center}
.drow .dn{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2)}
.drow .dv{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.drow .bar{grid-column:1 / -1; height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.drow .bar i{display:block; height:100%; background:var(--w); transition:width .35s ease}
.empty{padding:44px 20px; text-align:center; color:var(--muted); font-size:14.5px; display:flex; flex-direction:column; gap:14px; align-items:center}
.empty b{color:var(--ink); font-family:var(--disp); font-size:17px; font-weight:600}

/* ── тренажёр подсетей ──────────────────────────────── */
.drill{padding:24px 20px; display:flex; flex-direction:column; gap:18px}
.dtask{font-size:15px; color:var(--ink-2); max-width:60ch; line-height:1.5}
.dgiven{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.01em; color:var(--ink); font-variant-numeric:tabular-nums; overflow-x:auto; white-space:nowrap; padding-bottom:2px}
.dfields{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.fld{display:flex; flex-direction:column; gap:4px}
.fld label{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.fld input{font-family:var(--mono); font-size:16px; padding:9px 12px; border:1px solid var(--line-2); border-radius:7px; background:var(--surface); width:190px; font-variant-numeric:tabular-nums}
.fld input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fld input.ok{border-color:var(--ok)} .fld input.bad{border-color:var(--bad)}
.fld input.narrow{width:110px}
.timer{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; gap:14px; flex-wrap:wrap}
.timer b{color:var(--ink); font-weight:600}
.hintbox{font-size:14px; line-height:1.6; color:var(--ink-2); background:var(--surface-2); border-left:3px solid var(--accent); border-radius:6px; padding:11px 14px; max-width:64ch}
.hintbox .step{font-family:var(--mono); font-size:13px; color:var(--ink); display:block; margin-top:5px}

/* ── тренажёр команд ────────────────────────────────── */
.term{font-family:var(--mono); font-size:13.5px; line-height:1.75; background:#10201C; color:#CFE6DE; border-radius:8px; padding:14px 15px; overflow-x:auto; border:1px solid var(--line)}
:root[data-theme="light"] .term{background:#132522}
.term .pr{color:#6FA694}
.term .cmd{color:#F2E7CE}
.term .err{color:#F0776C}
.term .hintline{color:#8FA9A0; font-style:italic}
.termin{display:flex; align-items:center; gap:8px; margin-top:2px}
.termin .pr{color:#6FA694; white-space:nowrap}
.termin input{flex:1; min-width:80px; background:transparent; border:0; outline:none; font-family:var(--mono); font-size:13.5px; color:#F2E7CE; caret-color:#E8A33C}
.steps{display:flex; flex-direction:column; gap:6px}
.stp{display:flex; gap:9px; align-items:baseline; font-size:13.5px; color:var(--muted)}
.stp .n{font-family:var(--mono); font-size:11px; width:16px; flex:none}
.stp.done{color:var(--ok)} .stp.now{color:var(--ink); font-weight:500}

[hidden]{display:none !important}
.g.done .gv{color:var(--ok)}

/* ── шкала календаря: один оттенок, от светлого к насыщенному ── */
:root{--h0:#DFE4E2; --h1:#F1DDB8; --h2:#E2B36B; --h3:#BF7F22; --h4:#8C4E06}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--h0:#25302D; --h1:#4A3B20; --h2:#7D5C27; --h3:#BD8633; --h4:#F2B85C}
}
:root[data-theme="dark"]{--h0:#25302D; --h1:#4A3B20; --h2:#7D5C27; --h3:#BD8633; --h4:#F2B85C}

/* ── термины ────────────────────────────────────────── */
.gt{text-decoration:underline dotted; text-decoration-color:var(--accent); text-decoration-thickness:1.5px; text-underline-offset:3px; cursor:help; border-radius:3px}
.gt:hover,.gt[aria-expanded="true"]{background:var(--accent-soft)}
.gpop{position:absolute; z-index:40; width:min(340px, calc(100vw - 24px)); background:var(--surface); border:1px solid var(--line-2); border-radius:10px; box-shadow:0 14px 40px -12px rgba(0,0,0,.35); padding:13px 15px 12px; display:flex; flex-direction:column; gap:8px}
.gpop.sheet{position:fixed; left:0; right:0; bottom:0; width:auto; border-radius:14px 14px 0 0; max-height:72vh; overflow:auto; padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.gp-h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding-right:30px; position:relative}
.gp-h b{font-size:15.5px}
.gp-x{position:absolute; right:-8px; top:-8px; border:0; background:none; font-size:22px; line-height:1; color:var(--muted); padding:4px 9px; border-radius:6px}
.gp-x:hover{color:var(--ink); background:var(--surface-2)}
.gp-d{margin:0; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.gp-f{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.gp-ans{font-size:14px; line-height:1.55; color:var(--ink); border-top:1px solid var(--line); padding-top:9px}
.gp-ans p,.ask-a p{margin:0 0 7px}
.gp-ans p:last-child,.ask-a p:last-child{margin-bottom:0}

/* ── вопрос к Claude ────────────────────────────────── */
.askbtn{align-self:flex-start}
.askbox{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 13px}
.ask-h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.ask-h b{font-size:13.5px}
.ask-h span,.ask-note{font-size:12px; color:var(--muted)}
.ask-note{margin-top:4px}
.ask-log{display:flex; flex-direction:column; gap:9px; max-height:420px; overflow:auto}
.ask-q{align-self:flex-end; background:var(--accent-soft); border-radius:8px 8px 2px 8px; padding:6px 10px; font-size:13.5px; max-width:85%}
.ask-a{font-size:14.5px; line-height:1.6; color:var(--ink); max-width:64ch}
.ask-wait{color:var(--muted); font-style:italic}
.ask-chips{display:flex; gap:6px; flex-wrap:wrap}
.chipq{border:1px solid var(--line-2); border-radius:999px; padding:4px 11px; color:var(--ink-2)}
.ask-row{display:flex; gap:8px}
.ask-row input{flex:1; min-width:0; font-size:15px; padding:8px 11px; border:1px solid var(--line-2); border-radius:7px; background:var(--surface)}
.ask-row input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

/* ── практика ───────────────────────────────────────── */
.seg.scroll{max-width:100%; overflow-x:auto; scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.fld select{font-family:var(--body); font-size:14.5px; padding:9px 10px; border:1px solid var(--line-2); border-radius:7px; background:var(--surface); color:var(--ink); min-width:250px; max-width:100%}
.fld select.ok{border-color:var(--ok)} .fld select.bad{border-color:var(--bad)}
.fld.wide{flex:1 1 250px}
.pnote{font-size:13.5px; color:var(--bad)}
.drill .opts{max-width:600px}

/* ── прогресс ───────────────────────────────────────── */
.prog{padding:22px 20px; display:flex; flex-direction:column; gap:28px}
.pg-sec{display:flex; flex-direction:column; gap:12px}
.pg-h{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pg-empty{font-size:14px; color:var(--muted); max-width:60ch}
.meters{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 24px}
.meter{display:flex; flex-direction:column; gap:6px}
.mt-h{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-2)}
.mt-h b{color:var(--ink); font-weight:600}
.mt-bar{height:8px; border-radius:4px; background:var(--accent-soft); overflow:hidden}
.mt-bar i{display:block; height:100%; background:var(--accent); border-radius:0 4px 4px 0; transition:width .35s ease}
.mt-bar.sm{height:4px; margin-top:4px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.tile{display:flex; flex-direction:column; gap:2px; padding:11px 13px; background:var(--surface-2); border-radius:8px}
.tile span{font-size:12px; color:var(--muted)}
.tile b{font-size:26px; font-weight:600; line-height:1.15; color:var(--ink)}
.achs{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.ach{display:flex; gap:11px; padding:11px 12px; border:1px solid var(--line); border-radius:9px}
.ach-b{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1}
.ach-t{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ach-t b{font-size:14px}
.ach:not(.got) .ach-t b{color:var(--ink-2)}
.ach-d{font-size:12px; color:var(--muted); line-height:1.4}
.ach-v{font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:2px}
.medal{width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface-3); color:var(--muted)}
.medal svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.medal.on{background:var(--accent-soft); color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent)}
.pips{display:inline-flex; gap:3px}
.pips i{width:6px; height:6px; border-radius:50%; background:var(--line-2)}
.pips i.on{background:var(--accent)}
.heat-wrap{display:flex; gap:8px; align-items:flex-start; overflow-x:auto; padding:2px}
.heat-days{display:grid; grid-template-rows:repeat(7,18px); gap:4px; font-family:var(--mono); font-size:10px; color:var(--muted); line-height:18px}
.heat{display:grid; grid-template-rows:repeat(7,18px); grid-auto-flow:column; grid-auto-columns:18px; gap:4px}
.hc{width:18px; height:18px; border:0; border-radius:4px; padding:0; background:var(--h0)}
.hc.h1{background:var(--h1)} .hc.h2{background:var(--h2)} .hc.h3{background:var(--h3)} .hc.h4{background:var(--h4)}
.hc.hf{background:transparent; box-shadow:inset 0 0 0 1px var(--line); cursor:default}
.hc.today{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-2)}
.heat-leg{display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.heat-leg i{width:12px; height:12px; border-radius:3px; display:inline-block}
.heat-read{flex-basis:100%; color:var(--ink-2); margin-top:4px}
.pg-table summary{font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); cursor:pointer}
.pg-table .tw{overflow-x:auto}
.pg-table table{border-collapse:collapse; margin-top:8px; font-size:13px; font-variant-numeric:tabular-nums}
.pg-table th,.pg-table td{padding:5px 14px 5px 0; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.pg-table th:first-child,.pg-table td:first-child{text-align:left}
.pg-table th{font-weight:500; color:var(--muted)}
.wlist{display:flex; flex-direction:column; gap:12px}
.wrow{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) 48px auto; gap:6px 12px; align-items:center}
.w-name{font-size:14px; color:var(--ink); display:flex; flex-direction:column; min-width:0}
.w-name span{font-size:12px; color:var(--muted)}
.w-bar{height:8px; background:var(--surface-3); border-radius:0 4px 4px 0; overflow:hidden}
.w-bar i{display:block; height:100%; background:var(--ink-2); border-radius:0 4px 4px 0}
.w-val{font-size:13px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums}

/* ── уведомление о достижении ───────────────────────── */
.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,24px); opacity:0; z-index:60; display:flex; align-items:center; gap:11px; background:var(--ink); color:var(--surface); padding:10px 18px 10px 10px; border-radius:12px; box-shadow:0 14px 34px -10px rgba(0,0,0,.45); transition:transform .3s ease, opacity .3s ease; max-width:calc(100vw - 24px)}
.toast.in{transform:translate(-50%,0); opacity:1}
.toast b{display:block; font-size:14.5px}
.toast-l{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.72}
.toast .medal.on{background:var(--accent); color:var(--on-accent); box-shadow:none}

/* ── микс ────────────────────────────────────────────── */
.mixbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.mixtrack{flex:1 1 160px; min-width:120px; height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.mixtrack i{display:block; height:100%; background:var(--accent); border-radius:0 3px 3px 0; transition:width .35s ease}
.mixcount{font-family:var(--mono); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.mtype{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:1px 7px; line-height:1.6}

/* ── кейсы ───────────────────────────────────────────── */
.case-story{font-size:15px; color:var(--ink-2); max-width:64ch; line-height:1.55; margin:0}
.outs{display:flex; flex-direction:column; gap:10px}
.out{display:flex; flex-direction:column; gap:4px}
.out-l{font-family:var(--mono); font-size:11px; color:var(--muted)}
.stepchip{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stepchip b{color:var(--accent); font-weight:600}
.casefix{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding:18px 20px 20px}

/* ── сопоставление ───────────────────────────────────── */
.match{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mcol{display:flex; flex-direction:column; gap:8px; min-width:0}
.mi{display:flex; align-items:center; gap:8px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:14px; line-height:1.4; min-height:46px; overflow-wrap:anywhere; transition:border-color .15s, background .15s}
.mi:hover:not(:disabled){border-color:var(--accent)}
.mi.mono{font-family:var(--mono); font-size:13px}
.mi.sel{border-color:var(--accent); background:var(--accent-soft)}
.mi.done{border-color:var(--ok-line); background:var(--ok-bg); color:var(--ink-2); cursor:default}
.mi.bad{border-color:var(--bad); background:var(--bad-bg)}
.mi .pn{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ok); flex:none; min-width:12px}

/* ── поздравление с серией ───────────────────────────── */
.pstreak{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:61;
  display:flex; align-items:center; gap:12px; padding:10px 20px 10px 12px; border-radius:999px;
  background:var(--surface); border:1.5px solid var(--accent); box-shadow:0 18px 44px -14px rgba(0,0,0,.45);
  max-width:calc(100vw - 24px); animation:pst-in .42s cubic-bezier(.2,.9,.3,1.25)}
.pstreak.up{bottom:calc(88px + env(safe-area-inset-bottom))}
.pstreak.out{animation:pst-out .3s ease forwards}
.pstreak .pingface{width:44px; height:46px; animation:pst-bob .8s ease-in-out 2}
.pst-t{display:flex; flex-direction:column; min-width:0}
.pst-t b{font-family:var(--disp); font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--accent)}
.pst-t span{font-size:13px; color:var(--ink-2)}
.psp{position:absolute; left:14px; top:0; width:46px; height:100%; pointer-events:none}
.psp i{position:absolute; width:6px; height:6px; border-radius:2px; background:var(--accent); opacity:0; animation:pst-spark .95s ease-out forwards}
.psp i:nth-child(1){left:-4px; top:6px; animation-delay:.06s}
.psp i:nth-child(2){left:18px; top:-9px; animation-delay:.14s}
.psp i:nth-child(3){left:42px; top:2px; animation-delay:.1s}
.psp i:nth-child(4){left:34px; top:38px; animation-delay:.2s}
.psp i:nth-child(5){left:2px; top:40px; animation-delay:.26s}
@keyframes pst-in{0%{transform:translate(-50%,26px) scale(.86); opacity:0} 62%{transform:translate(-50%,-5px) scale(1.04); opacity:1} 100%{transform:translate(-50%,0) scale(1); opacity:1}}
@keyframes pst-out{to{transform:translate(-50%,14px) scale(.96); opacity:0}}
@keyframes pst-bob{0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes pst-spark{0%{transform:scale(0) rotate(0); opacity:0} 45%{transform:scale(1) rotate(30deg); opacity:1} 100%{transform:scale(.5) rotate(60deg) translateY(-10px); opacity:0}}

/* ── главный экран ───────────────────────────────────── */
.home{padding:20px; display:flex; flex-direction:column; gap:20px}
.hgo{display:flex; flex-direction:column; gap:7px; align-items:flex-start}
.btn.big{font-size:16px; padding:13px 22px}
.hgo-s{font-size:13px; color:var(--muted)}
.htiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:10px}
.htile{display:flex; flex-direction:column; gap:3px; align-items:flex-start; text-align:left; background:var(--surface-2); border:1px solid transparent; border-radius:10px; padding:12px 14px; transition:border-color .15s, background .15s}
.htile:hover{border-color:var(--accent); background:var(--accent-soft)}
.ht-n{font-size:13px; font-weight:600}
.htile b{font-family:var(--mono); font-size:21px; font-weight:600; line-height:1.25; color:var(--accent); font-variant-numeric:tabular-nums}
.ht-s{font-size:11.5px; color:var(--muted); line-height:1.35}
.hstage{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:14px}
.hstage b{font-weight:600; color:var(--ink)}

/* ── настройки ───────────────────────────────────────── */
.setbtn{width:34px; height:34px; padding:0; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:var(--surface); color:var(--ink-2); flex:none}
.setbtn:hover{border-color:var(--accent); color:var(--accent)}
.setbtn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.ovl{position:fixed; inset:0; background:rgba(10,14,13,.38); z-index:50}
.setp{position:fixed; z-index:51; right:16px; top:14px; width:min(370px, calc(100vw - 32px)); max-height:calc(100vh - 28px); overflow:auto; background:var(--surface); border:1px solid var(--line-2); border-radius:12px; box-shadow:0 22px 54px -16px rgba(0,0,0,.5); padding:15px 18px 20px; display:flex; flex-direction:column; gap:17px}
.set-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.set-top b{font-family:var(--disp); font-size:15px; font-weight:600}
.set-sec{display:flex; flex-direction:column; gap:9px}
.set-h{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.set-note{font-size:12px; color:var(--muted); line-height:1.45}
.set-sec .filters{gap:6px}
.set-sec .chip{font-size:12px}
.setp .seg{flex-wrap:wrap}
.set-danger{color:var(--bad); border-color:var(--bad-line)}
.set-danger:hover{border-color:var(--bad); color:var(--bad)}

/* ── мини-лекции ─────────────────────────────────────── */
.lidx{display:flex; flex-direction:column}
.lrow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:12px 20px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lnum{font-family:var(--mono); font-size:12px; font-weight:600; width:27px; height:27px; flex:none; display:grid; place-items:center; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums}
.lrow.done .lnum{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok)}
.lt{display:flex; flex-direction:column; min-width:0; flex:1}
.lt b{font-size:14.5px; font-weight:500}
.lmeta{font-family:var(--mono); font-size:11px; color:var(--muted)}
.lmark{font-family:var(--mono); font-size:13px; color:var(--muted); flex:none}
.lrow.done .lmark{color:var(--ok)}
.lect{padding:22px 20px 20px; display:flex; flex-direction:column; gap:19px}
.llead{margin:0; font-size:15.5px; line-height:1.6; color:var(--ink-2); max-width:64ch}
.lsec{display:flex; flex-direction:column; gap:9px}
.lsec h3{font-family:var(--disp); font-weight:600; font-size:13.5px; letter-spacing:-.01em; color:var(--accent)}
.lsec p{margin:0; font-size:15px; line-height:1.65; max-width:64ch}
.lsec ul,.lkey ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:6px; font-size:15px; line-height:1.55; max-width:64ch}
.lsec li::marker,.lkey li::marker{color:var(--accent)}
.lkey{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:6px; padding:13px 15px; display:flex; flex-direction:column; gap:9px}
.lkey ul{font-size:14.5px}

/* ── Пинг ────────────────────────────────────────────── */
.pingface{display:block; width:34px; height:36px; flex:none}
.pingsvg{display:block; width:100%; height:100%}
.pingsvg .bd{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.8; stroke-linejoin:round}
.pingsvg .ln{fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.pingsvg .ln.thin{stroke-width:1.4}
.pingsvg .sig{fill:var(--accent)}
.pingsvg .ey{fill:var(--ink)}
.pingsvg .mo{fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round}
.pingsvg .br{fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linecap:round}
.pingsvg .lg{fill:var(--ink); stroke:none}
.pingav{width:38px; height:38px; padding:0; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:var(--surface); flex:none; transition:border-color .15s, background .15s}
.pingav:hover{border-color:var(--accent); background:var(--accent-soft)}
.pingav .pingface{width:26px; height:27px}
.pingb{flex:1 1 100%; position:relative; display:flex; gap:11px; align-items:flex-start; background:var(--accent-soft); border:1px solid var(--line); border-radius:10px; padding:11px 13px}
.pingb .pingface{width:38px; height:40px}
.pingb-t{min-width:0; flex:1}
.pingb-t b{font-family:var(--disp); font-weight:600; font-size:12.5px; letter-spacing:-.01em}
.pingb-t p{margin:1px 0 0; font-size:14px; line-height:1.5; color:var(--ink-2); max-width:62ch}
.pingb-a{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.pingb-a .mini{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2)}
.pingb-a .mini:hover{border-color:var(--accent); color:var(--accent); background:var(--surface)}
.pingb>.pingb-t{padding-right:24px}
.pingb .gp-x{right:3px; top:1px}
.pingsay{display:flex; gap:10px; align-items:center; font-size:14px; line-height:1.5; color:var(--ink-2)}
.pingsay .pingface{width:32px; height:33px}
.pingbig{display:flex; gap:13px; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:13px 15px}
.pingbig .pingface{width:50px; height:52px}
.empty .pingface{width:62px; height:64px}

.chead .fb{margin-left:-4px; padding:2px 7px; font-size:11.5px; border:1px solid var(--line-2); border-radius:999px; color:var(--ink-2)}
.chead .fb:hover{border-color:var(--accent); color:var(--accent); background:transparent}

@media (max-width:620px){
  .brand{display:none}
  /* на телефоне место под задание важнее: шапка прокручивается вместе со страницей,
     блоки курса — одной строкой с горизонтальной прокруткой, кнопки действий — прилипают снизу */
  .rail{position:static}
  .filters{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -13px; padding:0 13px 2px}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .controls{position:sticky; bottom:0; z-index:15; margin:0 -13px; padding:10px 13px calc(10px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line)}
  .controls{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .controls:empty{display:none}
  .controls .btn{padding:9px 13px; flex:none}
  .seg.modes{overflow-x:auto; scrollbar-width:none}
  .seg.modes::-webkit-scrollbar{display:none}
  .opt.dim{padding:7px 12px; font-size:13.5px}
  .opt.dim .otext{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .qbody{gap:12px; padding-top:16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .pstreak{bottom:calc(84px + env(safe-area-inset-bottom))}
  .pstreak.up{bottom:calc(152px + env(safe-area-inset-bottom))}
  .pingav{margin-left:auto}
  .home{padding:16px 15px; gap:17px}
